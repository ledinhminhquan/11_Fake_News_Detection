[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews"
version = "1.0.0"
description = "Fake News & Misinformation Detection — a trainable classifier + an agentic, evidence-grounded fact-check (retrieve → stance/NLI → verdict with citations → abstain)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Le Dinh Minh Quan" }]
keywords = ["nlp", "fake-news", "misinformation", "fact-checking", "text-classification",
            "stance-detection", "nli", "retrieval", "agent"]

# Core deps only — the package, the TF-IDF + LogReg classifier, BM25 evidence
# retrieval, the lexical stance, the agent, and the metrics all run with just
# these (no torch). Heavy ML / serving libs are extras, imported lazily, so
# `pip install -e .` never forces torch and CI runs the test-suite download-free.
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scikit-learn>=1.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.30",
    "sentence-transformers>=3.0",
]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "gradio>=4.0"]
report = ["reportlab>=4.0", "python-pptx>=0.6.23", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = [
    "torch>=2.1", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.30", "sentence-transformers>=3.0",
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "gradio>=4.0",
    "reportlab>=4.0", "python-pptx>=0.6.23", "matplotlib>=3.7",
]

[project.scripts]
fakenews = "fakenews.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fakenews = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
